<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>極致貪食蛇 Ultra Snake</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="./style.css">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2300e5a8'/%3E%3Cpath d='M14 34c6-8 14 0 18-6s12-2 18-10' stroke='%23001815' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='44' cy='14' r='3' fill='%23001815'/%3E%3C/svg%3E">
	<meta name="theme-color" content="#0c0f14">
</head>
<body>
	<div id="app">
		<header class="hud">
			<div class="hud-left">
				<div class="score-label">分數</div>
				<div id="score" class="score">0</div>
			</div>
			<div class="hud-center">
				<button id="btn-pause" class="btn ghost" aria-label="暫停/繼續">❚❚</button>
				<button id="btn-sound" class="btn ghost" aria-label="音效開關">🔊</button>
				<button id="btn-theme" class="btn ghost" aria-label="主題切換">🌗</button>
			</div>
			<div class="hud-right">
				<div class="score-label">最高</div>
				<div id="high-score" class="score">0</div>
			</div>
		</header>

		<main class="stage-wrap">
			<canvas id="game" width="640" height="640"></canvas>
			<div id="overlay" class="overlay hidden">
				<h1 class="title">Game Over</h1>
				<p class="subtitle">你的分數：<span id="final-score">0</span></p>
				<div class="overlay-actions">
					<button id="btn-restart" class="btn primary">重新開始</button>
					<button id="btn-leaderboard" class="btn">排行榜</button>
				</div>
			</div>
			<div id="tip" class="tip">使用方向鍵或觸控按鈕移動</div>
		</main>

		<section class="panel">
			<div class="legend">
				<span class="chip food-normal">●</span> 食物
				<span class="chip food-boost">●</span> 加速
				<span class="chip food-slow">●</span> 減速
				<span class="chip food-double">●</span> 分數翻倍
				<span class="chip food-ghost">●</span> 隱形
			</div>
			<div class="dpad" aria-label="觸控方向盤">
				<button class="pad pad-up" data-dir="up" aria-label="上">▲</button>
				<div class="pad-mid">
					<button class="pad pad-left" data-dir="left" aria-label="左">◀</button>
					<button class="pad pad-right" data-dir="right" aria-label="右">▶</button>
				</div>
				<button class="pad pad-down" data-dir="down" aria-label="下">▼</button>
			</div>
		</section>

		<div id="board" class="leaderboard hidden" role="dialog" aria-modal="true" aria-labelledby="board-title">
			<div class="leaderboard-card">
				<div class="leaderboard-head">
					<h2 id="board-title">排行榜 Top 10</h2>
					<button id="btn-close-board" class="btn ghost" aria-label="關閉">✕</button>
				</div>
				<ol id="board-list" class="board-list"></ol>
				<div class="leaderboard-foot">
					<button id="btn-clear-board" class="btn danger">清除紀錄</button>
				</div>
			</div>
		</div>
	</div>

	<script src="./script.js"></script>
</body>
</html>
